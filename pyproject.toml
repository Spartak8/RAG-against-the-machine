[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "RAG system answering questions about the vLLM codebase"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fire>=0.5",
    "pydantic>=2",
    "tqdm>=4",
]

[dependency-groups]
dev = [
    "flake8>=6",
    "mypy>=1.8",
    "pytest>=8",
]
[tool.mypy]
exclude = ['^data/', '^\.venv/']
